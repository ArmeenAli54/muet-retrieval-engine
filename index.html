<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MUET Retrieval Engine | Data Structures & Algorithms</title>

  <meta name="keywords" content="MUET, Retrieval Engine, Data Structures and Algorithms, Hash Table, Inverted Index, Search Engine, Information Retrieval, Jamshoro, CS-251">

  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <header>
    <div class="glass nav-container">
      <a href="#home" class="brand" data-r="home">
        <span>MUET Retrieval</span>
        <span class="brand-badge">CS-251 PBL</span>

      <nav id="nav" aria-label="Main Navigation"></nav>
